name: Сборка exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "yt-dlp[default]" imageio-ffmpeg
          python -m pip download yt-dlp --no-deps -d build_wheels

      - name: Тесты
        run: python -m unittest discover -s tests -v

      - name: Сборка
        run: pyinstaller -y SoundpadMusic.spec

      - name: Самопроверка exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SoundpadMusic.exe -ArgumentList '--selftest','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: SoundpadMusic
          path: dist/SoundpadMusic.exe

      - name: Выложить в Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Soundpad Music (сборка ${{ github.run_number }})
          make_latest: true
          files: dist/SoundpadMusic.exe
          body: |
            Скачайте **SoundpadMusic.exe** ниже, запустите Soundpad, потом запустите exe.
            Python и ffmpeg уже внутри, ничего ставить не нужно.
